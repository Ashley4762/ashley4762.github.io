<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Room Viewer - Ashley</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
    #cam-info {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.75); color: #00ffcc;
      padding: 10px 14px; border-radius: 6px; font-family: monospace;
      font-size: 12px; pointer-events: none; z-index: 20; line-height: 1.5;
    }
  </style>

  <!-- Three.js + Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="cam-info">กำลังโหลดพิกัดกล้อง...</div>

  <script>
    // ==========================================
    // 🎬 ส่วนที่ 1: เตรียม Scene, Camera, Renderer
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x242426);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(-8, 6, 8); // มุมมองตั้งต้นเห็นทั้งห้อง

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1; // ปรับโทนแสงให้สมจริง ไม่ขาวจ้าเกินไป
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const clock = new THREE.Clock();

    // ==========================================
    // 💡 ส่วนที่ 2: จัดระบบแสงใหม่สไตล์ Warm Cozy
    // ==========================================
    // 1. แสงบรรยากาศนวลๆ ย้อมทั้งห้อง
    const hemiLight = new THREE.HemisphereLight(0xfff3e0, 0x3d3d40, 0.9);
    scene.add(hemiLight);

    // 2. แสงแดดเฉียงเข้ามาจากหน้าต่าง (โทนอุ่นทอง)
    const sunLight = new THREE.DirectionalLight(0xffecd2, 1.8);
    sunLight.position.set(5, 8, -4);
    scene.add(sunLight);

    // 3. แสงไฟเฉพาะจุดในห้องสร้างมิติแสงและเงา
    const roomWarmLight = new THREE.PointLight(0xffa726, 2.0, 10);
    roomWarmLight.position.set(0, 3, 0);
    scene.add(roomWarmLight);

    // ==========================================
    // 🪟 ส่วนที่ 3: ผ้าม่านพริ้วไหวด้วย Vertex Shader
    // ==========================================
    const curtainWidth = 3.0;   // 👈 ปรับความกว้างม่านตรงนี้
    const curtainHeight = 1.5;  // 👈 ปรับความยาวม่านตรงนี้

    const curtainMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      side: THREE.DoubleSide,
      transparent: true,
      vertexShader: `
        uniform float uTime;
        void main() {
          vec3 pos = position;
          // ด้านบนเกาะติดราว ด้านล่างสะบัดแรงขึ้น
          float w = clamp((${curtainHeight / 2.0} - pos.y) / ${curtainHeight}, 0.0, 1.0);
          
          float windPush = 0.12 * w; // แรงลมดันม่านลอยมาข้างหน้า
          float wave = sin(pos.x * 4.0 + uTime * 3.5) * 0.06 * w; // คลื่นลมสะบัด
          pos.z += windPush + wave;

          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        void main() {
          // โทนส้มอมเหลืองอุ่นๆ โปร่งแสง 0.45
          gl_FragColor = vec4(1.0, 0.75, 0.35, 0.45);
        }
      `
    });

    const windowCurtain = new THREE.Mesh(
      new THREE.PlaneGeometry(curtainWidth, curtainHeight, 24, 24),
      curtainMat
    );

    // 👈 [พิกัดม่าน] ปรับ x, y, z ให้ตรงช่องหน้าต่างของห้องเพื่อน
    windowCurtain.position.set(-10.0, .5, -1.5);
    scene.add(windowCurtain);

    // ==========================================
    // 📦 ส่วนที่ 4: โหลดโมเดล 3D ของเพื่อน
    // ==========================================
    const loader = new THREE.GLTFLoader();
    const modelUrl = 'https://raw.githubusercontent.com/Ashley4762/ashley4762.github.io/main/model%203D/scene.glb';

    loader.load(
      modelUrl,
      (gltf) => {
        scene.add(gltf.scene);
      },
      undefined,
      (error) => {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
      }
    );

    // ==========================================
    // 🔍 ส่วนที่ 5: ตรวจจับพิกัดกล้องบนหน้าจอ
    // ==========================================
    const infoBox = document.getElementById('cam-info');
    function logCameraPosition() {
      const cam = { x: camera.position.x.toFixed(2), y: camera.position.y.toFixed(2), z: camera.position.z.toFixed(2) };
      const tgt = { x: controls.target.x.toFixed(2), y: controls.target.y.toFixed(2), z: controls.target.z.toFixed(2) };
      infoBox.innerHTML = `📷 Camera: { x: ${cam.x}, y: ${cam.y}, z: ${cam.z} }<br>🎯 Target: { x: ${tgt.x}, y: ${tgt.y}, z: ${tgt.z} }`;
    }
    controls.addEventListener('end', logCameraPosition);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 🎬 ส่วนที่ 6: Loop อัปเดตการเคลื่อนไหว
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      curtainMat.uniforms.uTime.value = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
