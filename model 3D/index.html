  <meta charset="UTF-8">

  <title>Interactive 3D Portfolio v10</title>
  
  <style>
    /* จัดเรียง CSS ให้เป็นระเบียบและอ่านง่ายขึ้น */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Sarabun', sans-serif;
      background: #bfe3ff;
    }
    canvas {
      display: block;
    }
    #menu {
      position: fixed;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }
    .btn {
      width: 92px;
      padding: 8px 6px;
      border: 3px solid #fff;
      border-radius: 16px;
      background: #ffffffcc;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 4px 0 #0003;
      transition: .15s;
    }
    .btn:hover {
      transform: translateX(6px);
      background: #fff;
    }
    .btn.on {
      background: #ffd54f;
    }
    .ico {
      width: 64px;
      height: 64px;
      line-height: 64px;
      font-size: 34px;
      border-radius: 12px;
      margin: 0 auto 4px;
      background: #e8f1e0;
    }
    .btn img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin: 0 auto 4px;
      background: #ddd;
    }
    #panel {
      position: fixed;
      left: 126px;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      max-height: 80vh;
      overflow: auto;
      background: #fffffff0;
      border-radius: 18px;
      padding: 16px;
      display: none;
      z-index: 5;
      box-shadow: 0 6px 0 #0003;
    }
    #panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    #panel p {
      margin: 4px 0;
      font-size: 15px;
    }
    #panel iframe {
      width: 100%;
      height: 240px;
      border: 2px solid #ccc;
      border-radius: 10px;
      margin-top: 8px;
    }
    #close {
      float: right;
      cursor: pointer;
      font-size: 20px;
    }
    #cel {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 5;
      padding: 8px 14px;
      border-radius: 14px;
      border: 3px solid #fff;
      background: #ffffffcc;
      cursor: pointer;
      font-size: 14px;
    }
    #hint {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #234;
      font-size: 13px;
      z-index: 5;
      pointer-events: none;
    }
  </style>

  <!-- เพิ่ม: โค้ด Vertex Shader สำหรับ 3D -->
  <script id="vertexShader" type="x-shader/x-vertex">
    varying vec3 vNormal;
    void main() {
      // คำนวณหา normal เพื่อนำไปใช้ใน Fragment Shader
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  </script>

  <!-- เพิ่ม: โค้ด Fragment Shader (Cel Shader / Toon Shader) -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    varying vec3 vNormal;
    uniform vec3 lightDirection; // รับค่าเวกเตอร์ทิศทางของแสง
    uniform vec3 baseColor;      // รับค่าสีพื้นฐานของโมเดล

    void main() {
      // คำนวณระดับแสงจากการตกกระทบระหว่างแสงกับ normal
      float intensity = dot(vNormal, normalize(lightDirection));
      
      // แบ่งแสงเป็นระดับชั้น (Bands) เพื่อให้เกิดเงาแบบการ์ตูน (Cel Shading)
      if (intensity > 0.95) {
        intensity = 1.0;
      } else if (intensity > 0.5) {
        intensity = 0.7;
      } else if (intensity > 0.25) {
        intensity = 0.4;
      } else {
        intensity = 0.2;
      }
      
      gl_FragColor = vec4(baseColor * intensity, 1.0);
    }
  </script>
