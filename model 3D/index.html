<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive 3D Portfolio</title>

<style>
  /* ===== พื้นฐานหน้าเว็บ ===== */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Sarabun', sans-serif;
    background: #bfe3ff;
  }
  canvas { display: block; }

  /* ===== ปุ่มเมนูมุมซ้าย ===== */
  #menu {
    position: fixed;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
  }
  .btn {
    width: 92px;
    padding: 8px 6px;
    border: 3px solid #fff;
    border-radius: 16px;
    background: #ffffffcc;
    box-shadow: 0 4px 0 #0003;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }
  .btn:hover { transform: translateX(6px); background: #fff; }
  .btn.on    { background: #ffd54f; }          /* ปุ่มที่กำลังเลือกอยู่ */
  .btn .ico  { font-size: 44px; height: 64px; line-height: 64px; }
  .btn img {
    display: block;
    width: 64px;
    height: 64px;
    margin: 0 auto 4px;
    border-radius: 12px;
    object-fit: cover;
    background: #ddd;
  }

  /* ===== กล่องแสดงข้อมูล ===== */
  #panel {
    display: none;
    position: fixed;
    left: 126px;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    max-height: 80vh;
    overflow: auto;
    padding: 16px;
    border-radius: 18px;
    background: #fffffff0;
    box-shadow: 0 6px 0 #0003;
    z-index: 5;
  }
  #panel h2 { margin: 0 0 8px; font-size: 20px; }
  #panel p  { margin: 4px 0; font-size: 15px; }
  #panel iframe {
    width: 100%;
    height: 240px;
    margin-top: 8px;
    border: 2px solid #ccc;
    border-radius: 10px;
  }
  #close { float: right; font-size: 20px; cursor: pointer; }

  /* ===== ปุ่มสลับ cel shading + ข้อความแนะนำ ===== */
  #cel {
    position: fixed;
    right: 14px;
    top: 14px;
    padding: 8px 14px;
    border: 3px solid #fff;
    border-radius: 14px;
    background: #ffffffcc;
    font-size: 14px;
    cursor: pointer;
    z-index: 5;
  }
  #notice {
    display: none;
    position: fixed;
    left: 14px;
    bottom: 34px;
    max-width: 420px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fff3cd;
    color: #7a4b00;
    font-size: 13px;
    z-index: 9;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #234;
    font-size: 13px;
    pointer-events: none;
    z-index: 5;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- เมนูมุมซ้าย -->
<div id="menu">
  <div class="btn" data-k="me">
    <div class="ico" id="ico-me">🎓</div>
    <img class="faceimg" style="display:none">
    นิสิต
  </div>
  <div class="btn" data-k="dept"><div class="ico" id="ico-dept">🏫</div><img class="deptimg" style="display:none">แผนก</div>
  <div class="btn" data-k="work"><div class="ico" id="ico-work">🎨</div><img class="workimg" style="display:none">ผลงาน</div>
</div>

<!-- กล่องข้อมูล -->
<div id="panel">
  <span id="close">✕</span>
  <div id="panel-content"></div>
</div>

<div id="notice"></div>
<button id="cel">Cel shading: เปิด</button>
<div id="hint">ลากเมาส์หมุนฉาก • คลิกที่ป้าย / กระดานวาดรูป / ชื่อบนฐาน / รูปเหนือหลังคา</div>

// แถบสี 3 ขั้น (มืด / กลาง / สว่าง) เหมือนระบายสีการ์ตูน
const toonRamp = new THREE.DataTexture(
  new Uint8Array([90, 90, 90, 255,  175, 175, 175, 255,  255, 255, 255, 255]),
  3, 1, THREE.RGBAFormat
);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter;
toonRamp.needsUpdate = true;

const toon = (color, map = null) =>
  new THREE.MeshToonMaterial({ color, map, gradientMap: toonRamp });

// กล่องสถานะ (แสดงเมื่อเปิดด้วย ?debug) ใช้เช็คว่าอะไรโหลดได้/ไม่ได้
const statusLines = { version: 'เวอร์ชันโค้ด: v7 (หน้าต่างเหลือง+ภาพกระดาน)' };
const statusBox = document.createElement('div');
statusBox.style.cssText = 'position:fixed;right:14px;top:60px;z-index:9;padding:8px 12px;border-radius:10px;' +
  'background:#000a;color:#0fc;font:12px/1.6 monospace;white-space:pre;display:' + (DEBUG ? 'block' : 'none');
document.body.appendChild(statusBox);
function setStatus(key, text) {
  statusLines[key] = text;

}
setStatus('version', statusLines.version);

// ข้อความเตือนสีเหลืองมุมซ้ายล่าง (แสดงเมื่อมีอะไรโหลดไม่ได้ ไม่ต้องเปิด ?debug)
function showNotice(text) {
  const box = document.getElementById('notice');
  box.textContent = text;
  box.style.display = 'block';
}

// เส้นขอบ: ก๊อปปี้โมเดลมาขยายออกตามแนวตั้งฉาก แล้วหันด้านในออก (Vertex Shader)
const outlineMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: 0.03 } },          // ความหนาเส้นขอบ
  vertexShader: `
    uniform float t;
    void main() {
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * t, 1.0);
    }`,
  fragmentShader: `
    void main() { gl_FragColor = vec4(0.08, 0.06, 0.1, 1.0); }`
});

// ผ้าม่านโรงรถ: Vertex Shader ขยับจุดยอดตามเวลา (realtime) — ลมพัด + จีบผ้า
const curtainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uH: { value: GARAGE_CURTAIN.height } },
  side: THREE.DoubleSide,
  transparent: true,
  vertexShader: `
    uniform float uTime;
    uniform float uH;
    varying vec2  vUv;
    varying float vPleat;
    void main() {
      vec3 pos = position;
      float low = clamp((uH * 0.5 - pos.y) / uH, 0.0, 1.0);   // 0 = ราวด้านบน (ไม่ขยับ), 1 = ชายผ้าด้านล่าง (สะบัดสุด)

      // จีบผ้า: คลื่นตามแนวตั้ง ขยับเอียงเบา ๆ ตามลม
      float pleat = sin(pos.x * 20.0 + sin(uTime * 1.2 + pos.y * 2.0) * 0.4 * low);
      float windPush = 0.12 * low;                              // ลมดันผ้าออกมาข้างหน้า
      float wave = sin(pos.x * 4.0 + uTime * 3.5) * 0.06 * low; // คลื่นลมสะบัด

      pos.z += pleat * 0.06 + windPush + wave;
      vUv = uv;
      vPleat = pleat;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`,
  fragmentShader: `
    varying vec2  vUv;
    varying float vPleat;
    void main() {
      // ร่องจีบมืด สันจีบสว่าง
      float light = 0.55 + 0.45 * (vPleat * 0.5 + 0.5);
      vec3 col = mix(vec3(0.80, 0.33, 0.08), vec3(1.0, 0.72, 0.30), light);
      col *= mix(0.85, 1.0, vUv.y);                             // ชายผ้าด้านล่างเข้มขึ้นนิดหน่อย

      // เนื้อผ้า: เส้นด้ายตาราง ๆ ละเอียด
      col *= 0.95 + 0.05 * sin(vUv.x * 500.0) * sin(vUv.y * 300.0);

      // ชายผ้าด้านล่างเป็นแถบเข้ม มีเส้นทองคาด
      float hem = 1.0 - smoothstep(0.045, 0.06, vUv.y);
      col = mix(col, vec3(0.55, 0.22, 0.05), hem);
      float trim = smoothstep(0.062, 0.068, vUv.y) * (1.0 - smoothstep(0.072, 0.078, vUv.y));
      col = mix(col, vec3(1.0, 0.85, 0.35), trim);

      gl_FragColor = vec4(col, 0.93);
    }`
});

   5) พื้นหลัง: ท้องฟ้า พื้นหญ้า ภูเขา เมฆ
   ===================================================================== */

function createSky() {
  const material = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      top:    { value: new THREE.Color(0x4aa8ff) },
      bottom: { value: new THREE.Color(0xfff1c9) }
    },
    vertexShader: `
      varying float h;
      void main() {
        h = normalize(position).y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top;
      uniform vec3 bottom;
      varying float h;
      void main() {
        float t = smoothstep(0.0, 0.6, h);
        gl_FragColor = vec4(mix(bottom, top, t), 1.0);
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), material));
}

function createGround() {
  const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), toon(0x8fd16a));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.6;
  ground.receiveShadow = true;
  scene.add(ground);
}

function createHills() {
  const colors = [0x6fbf73, 0x5aa862, 0x7cc983];
  const count = 14;
  for (let i = 0; i < count; i++) {
    const angle  = (i / count) * Math.PI * 2 + Math.random() * 0.3;
    const radius = 55 + Math.random() * 25;
    const height = 10 + Math.random() * 16;
    const hill = new THREE.Mesh(
      new THREE.ConeGeometry(9 + Math.random() * 7, height, 6),
      toon(colors[i % 3])
    );
    hill.position.set(Math.cos(angle) * radius, height / 2 - 0.6, Math.sin(angle) * radius);
    scene.add(hill);
  }
}

function createClouds() {
  const list = [];
  for (let i = 0; i < 10; i++) {
    const cloud = new THREE.Group();
    for (let j = 0; j < 4; j++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(1.6 + Math.random() * 1.2, 16, 12),
        toon(0xffffff)
      );
      puff.position.set(j * 1.8 - 2.7, Math.random() * 0.6, Math.random() * 1.2);
      cloud.add(puff);
    }
    cloud.position.set(Math.random() * 120 - 60, 16 + Math.random() * 10, -25 - Math.random() * 40);
    scene.add(cloud);
    list.push(cloud);
  }
  return list;
}

createSky();
createGround();
createHills();
const clouds = createClouds();


/* =====================================================================
   6) รูปตัวเอง (โหลดจากไฟล์ เพราะรูปไม่ติดมากับ scene.glb)
   ===================================================================== */

let faceURL    = null;   // รูปที่ย่อแล้ว (ใช้ในปุ่มและกล่องข้อมูล)
let deptURL    = null;   // รูปแผนกที่ย่อแล้ว
let faceCanvas = null;   // รูปเดียวกัน ในรูปแบบ canvas (ใช้ทำ texture)
let photoMat   = null;   // วัสดุของกรอบรูปเหนือหลังคา

// ใส่รูปลงกรอบ: เรียกจากทั้งตอนรูปโหลดเสร็จ และตอนโมเดลโหลดเสร็จ
// (ใครเสร็จทีหลังก็เป็นคนใส่ ป้องกันกรณีรูปมาก่อนโมเดลแล้วรูปไม่ขึ้น)
function applyFaceToFrame() {
  if (!photoMat || !faceCanvas) return;
  const texture = new THREE.CanvasTexture(faceCanvas);
  texture.flipY = false;                       // UV จาก Blender ใช้แบบ glTF
  texture.colorSpace = THREE.SRGBColorSpace;
  photoMat.map = texture;
  photoMat.color.set(0xffffff);
  photoMat.needsUpdate = true;
  setStatus('photo', 'รูปบนกรอบ: ใส่แล้ว ✔');
}

// โหลดรูปจากรายชื่อไฟล์ (ลองทีละที่) → ตัดเป็นจัตุรัสตรงกลาง → ย่อเป็น size x size
function loadSquareImage(files, size, onLoaded, onAllFailed, i = 0) {
  if (i >= files.length) { onAllFailed(); return; }

  const img = new Image();
  img.crossOrigin = 'anonymous';               // ให้ดึงรูปจากเว็บอื่น (GitHub raw) มาใช้ได้
  img.onload = () => {
    const side = Math.min(img.width, img.height);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    canvas.getContext('2d').drawImage(
      img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size
    );
    onLoaded(canvas, files[i]);
  };
  img.onerror = () => {
    console.warn('โหลดรูปไม่ได้:', files[i]);
    loadSquareImage(files, size, onLoaded, onAllFailed, i + 1);   // ลองที่ถัดไป
  };
  img.src = files[i];
}

// รูปตัวเอง → ปุ่ม "นิสิต", กล่องข้อมูล, กรอบรูปเหนือหลังคา
loadSquareImage(FACE_FILES, 512,
  (canvas, file) => {
    faceCanvas = canvas;
    faceURL = canvas.toDataURL('image/jpeg', 0.85);
    setStatus('face', 'รูปตัวเอง: โหลดได้ ✔ (' + file + ')');
    document.querySelectorAll('.faceimg').forEach(e => { e.src = faceURL; e.style.display = 'block'; });
    document.getElementById('ico-me').style.display = 'none';
    applyFaceToFrame();
  },
  () => {
    setStatus('face', 'รูปตัวเอง: หาไม่เจอ ✘');
    showNotice('⚠ หารูปตัวเองไม่เจอ: ต้องมีไฟล์ face.png (หรือ face.jpg) อยู่โฟลเดอร์เดียวกับ index.html');
  }
);

// รูปแผนก → ปุ่ม "แผนก" และกล่องข้อมูล
loadSquareImage(DEPT_FILES, 512,
  (canvas, file) => {
    deptURL = canvas.toDataURL('image/jpeg', 0.85);
    setStatus('dept', 'รูปแผนก: โหลดได้ ✔ (' + file + ')');

    document.getElementById('ico-dept').style.display = 'none';

/* =====================================================================
   7) โมเดลบ้าน: แปลงเป็น cel shading, ย่อขนาด, แขวนผ้าม่านโรงรถ
   ===================================================================== */

const celMeshes = [];   // ชิ้นที่ทำ cel (เก็บไว้สลับเปิด/ปิด)
const pickables = [];   // ชิ้นที่คลิกได้

// ใช้ภาพบนกระดานวาดรูป (MyPaint) ทำรูปเล็กให้ปุ่ม "ผลงาน"
function makeWorkThumbnail(map) {
  const image = map && map.image;
  if (!image) return;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 128;
  const side = Math.min(image.width, image.height);
  canvas.getContext('2d').drawImage(image, 0, 0, side, side, 0, 0, 128, 128);
  document.querySelectorAll('.workimg').forEach(e => { e.src = canvas.toDataURL('image/png'); e.style.display = 'block'; });
  document.getElementById('ico-work').style.display = 'none';
}

// ภาพบนกระดาน: ใช้รูปที่ติดมากับโมเดล ถ้าไม่มีให้ใช้ภาพสำรองที่ฝังไว้
function getPaintMap(original) {
  if (original.map) { makeWorkThumbnail(original.map); return original.map; }
  const texture = new THREE.TextureLoader().load(PAINT_FALLBACK, makeWorkThumbnail);
  texture.flipY = false;                        // UV จาก Blender ใช้แบบ glTF
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function toonify(root) {
  const meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });

  meshes.forEach(mesh => {
    const original = mesh.material;

    // รูปตัวเอง และกระดานวาดรูป: โชว์สีจริง ไม่ทำ cel และไม่มีเส้นขอบ
    if (mesh.name === 'photoframe') {
      photoMat = new THREE.MeshBasicMaterial({ color: 0x999999, side: THREE.DoubleSide });  // รอรูปโหลด
      mesh.material = photoMat;
      pickables.push(mesh);
      applyFaceToFrame();                     // ถ้ารูปโหลดเสร็จก่อนโมเดล ใส่ตรงนี้
      return;
    }
    if (mesh.name === 'Plane001') {
      const paintMap = getPaintMap(original);
      mesh.material = new THREE.MeshBasicMaterial({ map: paintMap, side: THREE.DoubleSide });
      pickables.push(mesh);
      return;
    }

    // ชิ้นอื่น: เปลี่ยนเป็นวัสดุ toon + ใส่เส้นขอบ
    // เก็บ "แสงเรืองในตัว" (emissive) จาก Blender ไว้ด้วย เช่น หน้าต่างสีเหลืองเรืองแสง ไฟรถ
    const toonMat = new THREE.MeshToonMaterial({
      color: original.color ? original.color.clone() : 0xffffff,
      map: original.map || null,
      gradientMap: toonRamp,
      emissive: original.emissive ? original.emissive.clone() : 0x000000,
      emissiveIntensity: original.emissiveIntensity ?? 1,
      emissiveMap: original.emissiveMap || null
    });
    mesh.userData.original = original;
    mesh.userData.toon = toonMat;
    mesh.material = toonMat;
    mesh.castShadow = mesh.receiveShadow = true;

    const outline = new THREE.Mesh(mesh.geometry, outlineMat);
    outline.userData.isOutline = true;
    mesh.add(outline);

    celMeshes.push(mesh);
    pickables.push(mesh);
  });
}

// ย่อให้ฉากไม่เกิน SCENE_SIZE x SCENE_SIZE, วางกึ่งกลาง, ให้ฐานแตะพื้น
function fitModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  obj.scale.setScalar(SCENE_SIZE / Math.max(size.x, size.z));

  box.setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.set(-center.x, -box.min.y, -center.z);
}

// แขวนผ้าม่านหน้าหน้าต่างแต่ละบาน (ขนาดเท่าหน้าต่าง)
// แขวนผ้าม่านที่ช่องโรงรถ พร้อมราวม่าน: ใส่เป็นลูกของโมเดล จึงย่อขนาด/ย้ายตามโมเดลอัตโนมัติ
function addGarageCurtain(root) {
  const { width, height, pos } = GARAGE_CURTAIN;

  const curtain = new THREE.Mesh(new THREE.PlaneGeometry(width, height, 96, 24), curtainMat);
  curtain.position.set(...pos);
  root.add(curtain);

  // ราวม่าน (แท่งไม้ + หัวกลมสองข้าง) อยู่ขอบบนของผ้า
  const woodMat = new THREE.MeshToonMaterial({ color: 0x5a3a1a, gradientMap: toonRamp });
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, width + 0.3, 12), woodMat);
  rod.rotation.z = Math.PI / 2;
  rod.position.set(pos[0], pos[1] + height / 2 + 0.02, pos[2]);
  root.add(rod);
  [-1, 1].forEach(side => {
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), woodMat);
    knob.position.set(pos[0] + side * (width / 2 + 0.15), pos[1] + height / 2 + 0.02, pos[2]);
    root.add(knob);
  });

  setStatus('curtain', 'ผ้าม่านโรงรถ: แขวนแล้ว ✔');
}

// บ้านกล่องง่าย ๆ ใช้ชั่วคราวถ้าโหลด scene.glb ไม่ได้
function createFallbackHouse() {
  const group = new THREE.Group();
  const add = (geometry, color, y, name = '') => {
    const mesh = new THREE.Mesh(geometry, toon(color));
    mesh.position.y = y;
    mesh.name = name;
    group.add(mesh);
    return mesh;
  };
  add(new THREE.BoxGeometry(10, 1, 10), 0x4cbb3a, 0.5);
  add(new THREE.BoxGeometry(4, 3, 4),   0xd9c8a0, 2.5);
  add(new THREE.ConeGeometry(3.6, 2, 4), 0xb03a3a, 5).rotation.y = Math.PI / 4;
  add(new THREE.BoxGeometry(2, 1.4, 0.1), 0xdddddd, 1.8, 'sign').position.set(3.5, 1.8, 2);
  return group;
}

function addModel(obj) {
  toonify(obj);
  fitModel(obj);
  scene.add(obj);
  obj.updateMatrixWorld(true);
  try { addGarageCurtain(obj); }
  catch (err) { console.error(err); setStatus('curtain', 'ผ้าม่าน error: ' + err.message); }
}

new GLTFLoader().load(
  MODEL_FILE,
  gltf => { setStatus('model', 'โมเดล ' + MODEL_FILE + ': โหลดได้ ✔'); addModel(gltf.scene); },
  undefined,
  () => { setStatus('model', 'โมเดล ' + MODEL_FILE + ': โหลดไม่ได้ ✘ (ใช้บ้านสำรอง)'); addModel(createFallbackHouse()); }
);

// ปุ่มสลับ cel shading เปิด/ปิด
const celButton = document.getElementById('cel');
let celOn = true;
celButton.onclick = () => {
  celOn = !celOn;
  celButton.textContent = 'Cel shading: ' + (celOn ? 'เปิด' : 'ปิด');
  celMeshes.forEach(mesh => {
    mesh.material = celOn ? mesh.userData.toon : mesh.userData.original;
    mesh.children.forEach(child => { if (child.userData.isOutline) child.visible = celOn; });
  });
};


/* =====================================================================
   8) เมนูซ้ายมือ + กล่องข้อมูล + กล้องบินไปหา
   ===================================================================== */

const panel        = document.getElementById('panel');
const panelContent = document.getElementById('panel-content');
const buttons      = document.querySelectorAll('.btn');
let cameraGoal = null;   // เป้าหมายกล้อง {pos, look} ถ้าไม่มี = ไม่ต้องบิน

function buildPanelHTML(info) {
  let html = '';
  if (info.title) html += `<h2>${info.title}</h2>`;
  if (info.showFace && faceURL) {
    html += `<img src="${faceURL}" style="width:100%;border-radius:12px;margin-bottom:6px">`;
  }
  if (info.showDept && deptURL) {
    html += `<img src="${deptURL}" style="width:100%;border-radius:12px;margin-bottom:6px">`;
  }
  html += info.lines.map(line => `<p>${line}</p>`).join('');
  if (info.iframe) {
    html += `<iframe src="${info.iframe}"></iframe>`
          + `<p><a href="${info.iframe}" target="_blank">เปิดในแท็บใหม่</a></p>`;
  }
  return html;
}

function openInfo(key) {
  panelContent.innerHTML = buildPanelHTML(INFO[key]);
  panel.style.display = 'block';
  buttons.forEach(b => b.classList.toggle('on', b.dataset.k === key));

  cameraGoal = {
    pos:  new THREE.Vector3(...VIEWS[key].pos),
    look: new THREE.Vector3(...VIEWS[key].look)
  };
}

buttons.forEach(b => { b.onclick = () => openInfo(b.dataset.k); });
document.getElementById('close').onclick = () => {
  panel.style.display = 'none';
  buttons.forEach(b => b.classList.remove('on'));
};


/* =====================================================================
   9) 3D Picking: คลิกวัตถุในฉากเพื่อเปิดข้อมูล
   ===================================================================== */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointerDownAt = null;

renderer.domElement.addEventListener('pointerdown', e => {
  pointerDownAt = [e.clientX, e.clientY];
});

renderer.domElement.addEventListener('pointerup', e => {
  // ถ้าเมาส์เลื่อนไปไกล แปลว่ากำลังลากหมุนฉาก ไม่นับว่าเป็นการคลิก
  if (!pointerDownAt || Math.hypot(e.clientX - pointerDownAt[0], e.clientY - pointerDownAt[1]) > 5) return;

  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);

  const hit = raycaster.intersectObjects(pickables, false)[0];
  if (!hit) return;

  // รวบรวมชื่อของชิ้นที่โดน และชื่อของ "พ่อแม่" ทั้งหมด
  const names = [];
  for (let o = hit.object; o; o = o.parent) names.push(o.name.toLowerCase());
  if (DEBUG) console.log('คลิกโดน:', names.filter(Boolean).join(' < '));

  const key = PICK_ORDER.find(k => PICK[k].some(word => names.includes(word)));
  if (key) openInfo(key);
});


/* =====================================================================
   10) วนลูปวาดภาพ
   ===================================================================== */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  curtainMat.uniforms.uTime.value = clock.getElapsedTime();     // ผ้าม่านพริ้ว

  clouds.forEach((cloud, i) => {                                // เมฆลอย
    cloud.position.x += 0.01 + i * 0.001;
    if (cloud.position.x > 70) cloud.position.x = -70;
  });

  if (cameraGoal) {                                             // กล้องบินไปหาจุดที่กด
    camera.position.lerp(cameraGoal.pos, 0.06);
    controls.target.lerp(cameraGoal.look, 0.06);
    if (camera.position.distanceTo(cameraGoal.pos) < 0.05) cameraGoal = null;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
